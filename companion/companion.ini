[companion]
display_name=RK Client
player_id=
launch_volume=.15
active_volume=0.35

; The publisher sets this once to the public RK relay before release, ws:// or wss:// (wss://rk.hangaraddons.com/ws is encrypted).
; With a URL present, starting the EXE always joins the single global network.
; Users disable multiplayer simply by not running the EXE.
relay_url=ws://rk.hangaraddons.com:8787

; Leave simconnect_host blank when MSFS runs on this PC.
; To run the Companion on a different PC, put the IPv4 address or name of the PC running MSFS here.
; That PC needs a SimConnect.xml with the same port, and its firewall has to allow the port.
simconnect_host=
simconnect_port=500

; 0 turns the log file off. 1 writes companion.log beside the exe with connections, what the relay sends and what your position updates look like. 2 adds more detail.
; Send companion.log when you report a problem.
log_level=1
