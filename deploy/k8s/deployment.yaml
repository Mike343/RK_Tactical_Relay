apiVersion: apps/v1
kind: Deployment
metadata:
  name: rk-relay
  labels:
    app: rk-relay
spec:
  replicas: 2
  selector:
    matchLabels:
      app: rk-relay
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: rk-relay
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: rk-relay
      containers:
        - name: relay
          image: rk-tactical-relay:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: ws
              containerPort: 8787
            - name: peer
              containerPort: 8788
          env:
            - name: PORT
              value: "8787"
            - name: PEER_PORT
              value: "8788"
            - name: PEER_DNS
              value: rk-relay-peers
            - name: PEER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: rk-relay-peer
                  key: token
            - name: TEAM_RULES
              value: open
            - name: LOG_LEVEL
              value: "1"
            - name: PUBLIC_API
              value: "true"
            - name: TRUST_PROXY
              value: "true"
            - name: DRAIN_SECONDS
              value: "10"
            - name: MAX_CONNS_PER_IP
              value: "64"
            - name: GOMEMLIMIT
              value: 200MiB
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
          readinessProbe:
            httpGet:
              path: /ready
              port: ws
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: ws
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
