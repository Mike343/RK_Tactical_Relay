apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: rk-relay
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: rk-relay
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 600
      policies:
        - type: Pods
          value: 1
          periodSeconds: 300
